<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASCADE CSS</title>
    <link rel="stylesheet" href="cascade.css">
</head>
<body>
     <a href="index.html" style="text-decoration: none;">Back Home</a>
     <p class="parag">I'm just a paragraph with extra bold text!</p>
     <p class="small-para">I'm a smaller paragraph, also with extra bold text!</p>

     <button id="comfirm-button" class="comfirm button">Confirm</button>
     <button id="cancel-button" class="cancel button">Cancel</button>

    <div class="text">I'm a div with thin text!</div>
    <div class="text">I'm a div with thin text and a child div!
    <div class="text child">I'm a smaller child div with extra bold text.</div>
    </div>
</body>
</html>
